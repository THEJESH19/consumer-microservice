spring.application.name=consumer-microservice
server.port=8081

# Kafka Config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pipeline-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Ordering configuration
ordering.mode=PER_KEY
ordering.topic-partitions=6
ordering.topic-name=pipeline-messages

# Retry settings
retry.interval-ms=10000
# Set retry.max-attempts to -1 (or any value <= 0) for unlimited retries
retry.max-attempts=0

# Downstream persister endpoint
persister.url=http://localhost:8082

# Actuator settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.kafka=INFO
logging.level.com.skylo.streaming=DEBUG
